[project]
name = "cli"
version = "0.1.0"
description = "Command-Line Interface components for CVBrewer"
readme = "README.md"
authors = [
    { name = "delgadoarlee", email = "delgadoarlee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "questionary>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
