[project]
name = "cv-brewer"
version = "0.1.0"
description = "CVBrewer application components"
readme = "README.md"
authors = [
    { name = "delgadoarlee", email = "delgadoarlee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.0,<5.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.0,<3.0",
    "pypdf>=6.0,<7.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["cli", "core", "database", "llm"]
source-exclude = ["*/docs/**", "*/data/**", "*/README.md"]
wheel-exclude = ["*/docs/**", "*/data/**", "*/README.md"]
