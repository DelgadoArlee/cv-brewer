[project]
name = "cv-brewer-workspace"
version = "0.1.0"
description = "CVBrewer monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cv-brewer"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["app"]

[tool.uv.sources]
cv-brewer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "application_startup: application startup tests that run before all other tests",
    "requires_empty_data: tests that require an empty database or test data before data-inserting tests",
]
