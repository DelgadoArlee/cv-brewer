[project]
name = "cv-brewer"
version = "0.1.0"
description = "CVBrewer monorepo test workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["database"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["database"]

[tool.uv.sources]
database = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
